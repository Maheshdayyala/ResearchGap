<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}ResearchGapAI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">Research<span>Gap</span>AI</a>
  {% if current_user.is_authenticated %}
  <nav>
    <a href="{{ url_for('index') }}">New analysis</a>
    <a href="{{ url_for('history_page') }}">History</a>
    <a href="{{ url_for('evaluation_page') }}">Evaluation</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link">Sign out</button></form>
  </nav>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<script src="{{ url_for('static', filename='app.js', v='csrf-refresh-20261109') }}" defer></script>
</body>
</html>
