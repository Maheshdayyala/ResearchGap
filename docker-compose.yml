services:
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-before-deployment}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rgai}:${POSTGRES_PASSWORD:-rgai}@postgres:5432/${POSTGRES_DB:-researchgapai}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-researchgap}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      S2_API_KEY: ${S2_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
  
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rgai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rgai}
      POSTGRES_DB: ${POSTGRES_DB:-researchgapai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-researchgap}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-researchgap}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${HEALTHCHECK_PASSWORD}\" \"RETURN 1;\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata: {}
  neodata: {}
